[project]
name = "nreal-air-viewer"
version = "0.1.0"
description = "Nreal Airのリアルタイムセンサー表示"
requires-python = ">=3.11"
dependencies = [
    "hidapi==0.15.0",
    "vqf==2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nreal_air"]

[project.scripts]
air-viewer = "nreal_air.server:main"
air-capture = "nreal_air.capture:main"
